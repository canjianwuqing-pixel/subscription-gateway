server {
    listen 8443 ssl;
    ssl_certificate /ssl/active/fullchain.pem;
    ssl_certificate_key /ssl/active/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name _;
    server_tokens off;
    access_log off;

    client_max_body_size 64k;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'" always;

    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/src/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_X_CSRF_TOKEN $http_x_csrf_token;
        fastcgi_pass 127.0.0.1:9000;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}

server {
    listen 127.0.0.1:8080;
    server_name localhost;
    access_log off;
    location = /healthz {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/src/health.php;
        fastcgi_pass 127.0.0.1:9000;
    }
    location / { return 404; }
}
