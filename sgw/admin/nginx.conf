server {
    listen 8443 ssl;
    ssl_certificate /ssl/active/fullchain.pem;
    ssl_certificate_key /ssl/active/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name __GATEWAY_DOMAIN__;
    if ($http_host !~* "^__GATEWAY_DOMAIN_REGEX__(:__ADMIN_PORT__)?$") { return 444; }
    server_tokens off;
    access_log off;

    client_max_body_size 64k;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'" always;

    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/src/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_X_CSRF_TOKEN $http_x_csrf_token;
        fastcgi_pass 127.0.0.1:9000;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}

server {
    listen 127.0.0.1:8080;
    server_name localhost;
    access_log off;
    location = /healthz {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/src/health.php;
        fastcgi_pass 127.0.0.1:9000;
    }
    location / { return 404; }
}

server {
    listen 8081;
    server_name subscription-transformer;
    server_tokens off;
    access_log off;
    client_max_body_size 1k;

    location ~ ^/api/v1/[^/]+/subscribe$ {
        limit_except GET HEAD { deny all; }
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/src/transformer.php;
        fastcgi_param SCRIPT_NAME /transformer.php;
        fastcgi_param HTTP_USER_AGENT $http_user_agent;
        fastcgi_param HTTP_ACCEPT $http_accept;
        fastcgi_param HTTP_X_SGW_CLIENT_IP $http_x_sgw_client_ip;
        fastcgi_param HTTP_X_SGW_TRACKING_MODE $http_x_sgw_tracking_mode;
        fastcgi_param HTTP_X_SGW_VALIDATED_TOKEN $http_x_sgw_validated_token;
        fastcgi_read_timeout 35s;
        fastcgi_buffering off;
        fastcgi_pass 127.0.0.1:9001;
    }

    location / { return 404; }
}
