services:
  gateway:
    build: ./gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT}:8080"
    environment:
      DNS_RESOLVER: ${DNS_RESOLVER:?DNS_RESOLVER is required}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      REAL_IP_HEADER: ${REAL_IP_HEADER:-X-Forwarded-For}
    volumes:
      - control_data:/control
      - gateway_generated:/etc/nginx/generated
      - gateway_logs:/var/log/nginx
    depends_on:
      - admin

  admin:
    build: ./admin
    restart: unless-stopped
    env_file: .env
    ports:
      - "${ADMIN_BIND:-127.0.0.1}:${ADMIN_PORT:-8088}:8080"
    volumes:
      - control_data:/control
      - sqlite_data:/data

volumes:
  control_data:
  gateway_generated:
  gateway_logs:
  sqlite_data:
