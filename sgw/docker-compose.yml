name: subscription-gateway
services:
  gateway:
    image: subscription-gateway/gateway:current
    build: ./gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_HTTPS_PORT:-443}:8443"
    environment:
      GATEWAY_DOMAIN: ${GATEWAY_DOMAIN:?GATEWAY_DOMAIN is required}
      DNS_RESOLVER: ${DNS_RESOLVER:?DNS_RESOLVER is required}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      REAL_IP_HEADER: ${REAL_IP_HEADER:-X-Forwarded-For}
      APP_GID: ${APP_GID:-82}
    volumes:
      - ./runtime/control:/control
      - ./runtime/generated:/etc/nginx/generated
      - ./runtime/logs:/var/log/nginx
      - ./runtime/ssl:/ssl:ro
      - ./runtime/domain-certs:/domain-certs:ro
    depends_on:
      - admin
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

  admin:
    image: subscription-gateway/admin:current
    build: ./admin
    restart: unless-stopped
    env_file: ${DEPLOY_ENV_FILE:-.env}
    ports:
      - "${ADMIN_BIND:-0.0.0.0}:${ADMIN_PORT:-64444}:8443"
    expose:
      - "8081"
    volumes:
      - ./runtime/control:/control
      - ./runtime/data:/data
      - ./runtime/logs:/var/log/subscription-gateway:ro
      - ./runtime/ssl:/ssl:ro
      - ./runtime/domain-certs:/domain-certs
      - ./runtime/backups/database:/backups
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
