location ~ ^/api/v1/[^/]+/subscribe$ {
    if ($gateway_ready = 0) { return 444; }
    if ($token_query_duplicate) { return 400; }
    if ($token_query_unsafe) { return 400; }
    if ($token_valid = 0) { return 400; }
    if ($policy_block) { return 403; }

    access_log /var/log/nginx/access.log gateway;
    access_log /var/log/nginx/token-events.log token_events if=$token_event_loggable;

    proxy_set_header Host $gateway_subscription_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-SGW-Client-IP $tracking_internal_client_ip;
    proxy_set_header X-SGW-Tracking-Mode $tracking_internal_mode;
    proxy_set_header X-SGW-Validated-Token $tracking_internal_token;
    proxy_ssl_server_name on;
    proxy_ssl_name $gateway_subscription_ssl_name;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/cert.pem;
    proxy_ssl_verify_depth 3;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_intercept_errors off;
    error_page 502 503 504 = $tracking_failure_uri;
    proxy_pass $gateway_subscription_upstream$request_uri;
}

location = /__sgw_preflight_fallback {
    internal;
    proxy_set_header Host $gateway_upstream_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_ssl_server_name on;
    proxy_ssl_name $gateway_upstream_host;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/cert.pem;
    proxy_ssl_verify_depth 3;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_intercept_errors off;
    proxy_pass $gateway_upstream$request_uri;
}
location = /__sgw_tracking_502 { internal; return 502; }
location = /__sgw_tracking_503 { internal; return 503; }
location = /__sgw_tracking_504 { internal; return 504; }

location / { return 444; }
