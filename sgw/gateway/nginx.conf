worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log crit;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    merge_slashes off;
    map_hash_bucket_size 128;

    log_format gateway escape=json
        '{"time":"$time_iso8601","ip":"$remote_addr","method":"$request_method",'
        '"path":"$uri","ua":"$http_user_agent","status":$status,'
        '"request_time":"$request_time","upstream_status":"$upstream_status",'
        '"policy":"$log_decision"}';
    access_log /var/log/nginx/access.log gateway;

    include /etc/nginx/generated/real_ip.conf;
    include /etc/nginx/generated/rules.conf;

    map "$tracking_mode:$upstream_status" $tracking_failure_uri {
        default /__sgw_tracking_503;
        ~^preflight: /__sgw_preflight_fallback;
        ~^off:502 /__sgw_tracking_502;
        ~^off:503 /__sgw_tracking_503;
        ~^off:504 /__sgw_tracking_504;
    }

    resolver __DNS_RESOLVER__ valid=30s ipv6=off;
    resolver_timeout 3s;

    server {
        listen 8443 ssl default_server;
        server_name _;
        ssl_certificate /ssl/active/fullchain.pem;
        ssl_certificate_key /ssl/active/privkey.pem;
        return 444;
    }
    server {
        listen 8443 ssl;
        server_name __GATEWAY_DOMAIN__;
        ssl_certificate /ssl/active/fullchain.pem;
        ssl_certificate_key /ssl/active/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        include /etc/nginx/gateway-locations.conf;
    }
    include /control/domains.conf;
    server {
        listen 127.0.0.1:8080;
        server_name localhost;
        access_log off;
        location = /healthz { return 200 "ok"; }
        location / { return 444; }
    }
}
