worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log crit;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    merge_slashes off;
    map_hash_bucket_size 128;

    log_format gateway escape=json
        '{"time":"$time_iso8601","ip":"$remote_addr","method":"$request_method",'
        '"path":"$uri","ua":"$http_user_agent","status":$status,'
        '"request_time":"$request_time","upstream_status":"$upstream_status",'
        '"policy":"$log_decision"}';
    access_log /var/log/nginx/access.log gateway;

    include /etc/nginx/generated/real_ip.conf;
    include /etc/nginx/generated/rules.conf;

    map "$tracking_mode:$upstream_status" $tracking_failure_uri {
        default /__sgw_tracking_503;
        ~^preflight: /__sgw_preflight_fallback;
        ~^off:502 /__sgw_tracking_502;
        ~^off:503 /__sgw_tracking_503;
        ~^off:504 /__sgw_tracking_504;
    }

    resolver __DNS_RESOLVER__ valid=30s ipv6=off;
    resolver_timeout 3s;

    server {
        listen 8443 ssl default_server;
        server_name _;
        ssl_certificate /ssl/active/fullchain.pem;
        ssl_certificate_key /ssl/active/privkey.pem;
        return 444;
    }
    server {
        listen 8443 ssl;
        server_name __GATEWAY_DOMAIN__;
        ssl_certificate /ssl/active/fullchain.pem;
        ssl_certificate_key /ssl/active/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location ~ ^/api/v1/[^/]+/subscribe$ {
            if ($gateway_ready = 0) { return 444; }
            if ($token_query_duplicate) { return 400; }
            if ($token_query_unsafe) { return 400; }
            if ($token_valid = 0) { return 400; }
            if ($policy_block) { return 403; }

            access_log /var/log/nginx/access.log gateway;
            access_log /var/log/nginx/token-events.log token_events if=$token_event_loggable;

            proxy_set_header Host $gateway_subscription_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-SGW-Client-IP $tracking_internal_client_ip;
            proxy_set_header X-SGW-Tracking-Mode $tracking_internal_mode;
            proxy_set_header X-SGW-Validated-Token $tracking_internal_token;
            proxy_ssl_server_name on;
            proxy_ssl_name $gateway_subscription_ssl_name;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/ssl/cert.pem;
            proxy_ssl_verify_depth 3;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_intercept_errors off;
            error_page 502 503 504 = $tracking_failure_uri;
            proxy_pass $gateway_subscription_upstream$request_uri;
        }

        location = /__sgw_preflight_fallback {
            internal;
            proxy_set_header Host $gateway_upstream_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_ssl_server_name on;
            proxy_ssl_name $gateway_upstream_host;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/ssl/cert.pem;
            proxy_ssl_verify_depth 3;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_intercept_errors off;
            proxy_pass $gateway_upstream$request_uri;
        }
        location = /__sgw_tracking_502 { internal; return 502; }
        location = /__sgw_tracking_503 { internal; return 503; }
        location = /__sgw_tracking_504 { internal; return 504; }

        location / { return 444; }
    }
    server {
        listen 127.0.0.1:8080;
        server_name localhost;
        access_log off;
        location = /healthz { return 200 "ok"; }
        location / { return 444; }
    }
}
