worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log crit;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    merge_slashes off;
    map_hash_bucket_size 128;

    log_format gateway escape=json
        '{"time":"$time_iso8601","ip":"$remote_addr","method":"$request_method",'
        '"path":"$uri","ua":"$http_user_agent","status":$status,'
        '"request_time":"$request_time","upstream_status":"$upstream_status",'
        '"policy":"$policy_reason"}';
    access_log /var/log/nginx/access.log gateway;

    include /etc/nginx/generated/real_ip.conf;
    include /etc/nginx/generated/rules.conf;

    resolver __DNS_RESOLVER__ valid=30s ipv6=off;
    resolver_timeout 3s;

    server {
        listen 8080;
        server_name _;

        location ~ ^/api/v1/[^/]+/subscribe$ {
            if ($gateway_ready = 0) { return 444; }
            if ($token_valid = 0) { return 400; }
            if ($policy_block) { return 403; }

            proxy_set_header Host $gateway_upstream_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_ssl_server_name on;
            proxy_ssl_name $gateway_upstream_host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_pass $gateway_upstream$request_uri;
        }

        location / { return 444; }
    }
}
